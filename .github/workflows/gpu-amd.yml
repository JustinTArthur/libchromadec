name: gpu-amd-validation

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: read

concurrency:
  group: gpu-amd
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  AWS_AZ: us-east-2c
  INSTANCE_TYPE: g4ad.xlarge
  AMI_PARAM: /aws/service/canonical/ubuntu/server/noble/stable/current/amd64/hvm/ebs-gp3/ami-id
  RUNNER_LABEL: chd-amd-${{ github.run_id }}
  # Keep in sync with the amd-test job's `container.image` below: the job-level
  # container key can't read the env context, so the tag is spelled twice.
  ROCM_DOCKER_IMAGE: rocm/dev-ubuntu-24.04:7.2.3-complete

jobs:
  launch-spot:
    # Nothing to launch without an AWS role to assume; skip rather than fail
    # on a repo that hasn't set AWS_GPU_RUNNER_ROLE_ARN.
    if: vars.AWS_GPU_RUNNER_ROLE_ARN != ''
    # Environment is what the AWS role trusts, so any branch may run this while
    # only jobs naming the environment can assume the role. Branch limits and
    # approvals live on the environment.
    environment: gpu-ci
    runs-on: ubuntu-latest
    outputs:
      instance_id: ${{ steps.launch.outputs.instance_id }}
      runner_label: ${{ env.RUNNER_LABEL }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_GPU_RUNNER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve AMI
        id: ami
        run: |
          AMI_ID=$(aws ssm get-parameter --name "$AMI_PARAM" --query 'Parameter.Value' --output text)
          echo "ami_id=$AMI_ID" >> $GITHUB_OUTPUT
          echo "Resolved AMI: $AMI_ID"

      - name: Generate runner registration token
        id: runner-token
        env:
          GH_TOKEN: ${{ secrets.GH_RUNNER_MGMT_TOKEN }}
        run: |
          TOKEN=$(gh api -X POST repos/${{ github.repository }}/actions/runners/registration-token --jq '.token')
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Launch spot instance
        id: launch
        env:
          RUNNER_TOKEN: ${{ steps.runner-token.outputs.token }}
          REPO_URL: https://github.com/${{ github.repository }}
        run: |
          # User-data: install amdgpu + Docker on stock Ubuntu, pre-pull the
          # ROCm image so the test job starts fast, then launch the GH runner
          # agent as a one-shot ephemeral runner.
          USER_DATA=$(cat <<EOF
          #!/bin/bash
          set -eux
          # Hard cap: terminate after 60min for AMD (longer bootstrap window).
          (sleep 3600 && shutdown -h now) &

          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends -qq \\
            curl ca-certificates gnupg lsb-release jq

          # amdgpu kernel driver from AMD's apt repo. The AMI is stock Ubuntu
          # 24.04 with no amdgpu module, so amdgpu-dkms builds one against the
          # running kernel. That build and the image pre-pull below are why
          # the AMD watchdog gets 60 minutes to the CUDA side's 30.
          mkdir --parents --mode=0755 /etc/apt/keyrings
          curl https://repo.radeon.com/rocm/rocm.gpg.key | gpg --dearmor > /etc/apt/keyrings/rocm.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/amdgpu/latest/ubuntu noble main" \\
            > /etc/apt/sources.list.d/amdgpu.list
          apt-get update -qq
          # amdgpu.ko links the kernel's DRM display helpers, which AMD's DKMS
          # package does not ship. AWS-optimised kernels keep those in
          # linux-modules-extra, absent from stock cloud images, so without this
          # the module builds fine and then refuses to load on a pile of
          # "Unknown symbol drm_dp_*" errors.
          apt-get install -y --no-install-recommends -qq "linux-modules-extra-\$(uname -r)"
          apt-get install -y --no-install-recommends -qq amdgpu-dkms

          # DKMS builds amdgpu.ko and installs it under /lib/modules, but does
          # not load it, and this instance never reboots. Without the module
          # there is no /dev/kfd and the ROCm container cannot start. Kept
          # non-fatal on purpose: aborting here would leave the runner
          # unregistered, and the job would die on a 30-minute registration
          # timeout instead of docker's precise "no such file or directory
          # /dev/kfd" a couple of minutes in.
          # /dev/kfd alone is not proof of a working GPU: the KFD char device
          # appears whenever the module loads, even when every IP block failed
          # to init and no device attached. A render node under /dev/dri is
          # what separates the two, so wait on both.
          modprobe amdgpu || echo "WARNING: modprobe amdgpu failed"
          for i in \$(seq 1 30); do
            [ -e /dev/kfd ] && ls /dev/dri/renderD* >/dev/null 2>&1 && break
            sleep 1
          done
          ls -l /dev/kfd /dev/dri \\
            || echo "WARNING: no /dev/kfd; the ROCm container will fail to start"
          ls /dev/dri/renderD* >/dev/null 2>&1 \\
            || echo "WARNING: no render node; amdgpu loaded but bound no GPU"

          # Docker via the docker.io apt package (faster than the Docker
          # convenience script and adequate for our use).
          apt-get install -y --no-install-recommends -qq docker.io
          systemctl enable --now docker

          # Pre-pull the ROCm image so test-job startup is fast. Best-effort:
          # a failure here only costs time, since the job's own container
          # init pulls it again and reports the real error.
          docker pull "${ROCM_DOCKER_IMAGE}" || echo "WARNING: pre-pull of ${ROCM_DOCKER_IMAGE} failed"

          # Set up GH Actions runner under a non-root user, in the docker
          # group so jobs can talk to Docker without sudo.
          useradd -m -s /bin/bash -G docker ghrunner
          cd /home/ghrunner
          RUNNER_VERSION=2.335.1
          curl -sSL -o actions-runner.tar.gz \\
            https://github.com/actions/runner/releases/download/v\${RUNNER_VERSION}/actions-runner-linux-x64-\${RUNNER_VERSION}.tar.gz
          tar xzf actions-runner.tar.gz
          chown -R ghrunner:ghrunner /home/ghrunner

          sudo -u ghrunner bash -c '
            cd /home/ghrunner
            ./config.sh \\
              --url "${REPO_URL}" \\
              --token "${RUNNER_TOKEN}" \\
              --labels "${RUNNER_LABEL},gpu,amd" \\
              --ephemeral \\
              --unattended \\
              --disableupdate \\
              --replace
            ./run.sh
          '

          shutdown -h now
          EOF
          )

          # 150 GB root: the ROCm image alone unpacks to ~29 GB, and the
          # checkout, build tree and encode-orc all land on top of it.
          INSTANCE_ID=$(aws ec2 run-instances \
            --instance-type "$INSTANCE_TYPE" \
            --image-id "${{ steps.ami.outputs.ami_id }}" \
            --placement "AvailabilityZone=${AWS_AZ}" \
            --instance-market-options 'MarketType=spot' \
            --instance-initiated-shutdown-behavior terminate \
            --block-device-mappings '[{"DeviceName":"/dev/sda1","Ebs":{"VolumeSize":150,"VolumeType":"gp3"}}]' \
            --user-data "$USER_DATA" \
            --tag-specifications "ResourceType=instance,Tags=[{Key=Project,Value=libchromadec},{Key=Purpose,Value=ci-amd},{Key=RunId,Value=${{ github.run_id }}},{Key=RunnerLabel,Value=${RUNNER_LABEL}}]" \
            --query 'Instances[0].InstanceId' \
            --output text)
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "Launched $INSTANCE_ID; waiting for runner to register..."

      - name: Wait for runner to come online
        env:
          GH_TOKEN: ${{ secrets.GH_RUNNER_MGMT_TOKEN }}
        run: |
          # AMD bootstrap is longer than NVIDIA: amdgpu install, Docker
          # install + image pull. The ROCm image is a 7 GB pull landing on top
          # of the amdgpu-dkms build, so allow 30 minutes — still inside the
          # 60-minute instance watchdog, with room for the test job after.
          for i in $(seq 1 180); do
            if gh api repos/${{ github.repository }}/actions/runners --paginate \
                 --jq '.runners[] | select(.labels[].name == "'"${RUNNER_LABEL}"'") | .id' \
                 | grep -q .; then
              echo "Runner ${RUNNER_LABEL} is online."
              exit 0
            fi
            sleep 10
          done
          echo "Runner ${RUNNER_LABEL} did not register within 30 minutes."
          aws ec2 terminate-instances --instance-ids "${{ steps.launch.outputs.instance_id }}" || true
          exit 1

  amd-test:
    needs: launch-spot
    runs-on: [self-hosted, "${{ needs.launch-spot.outputs.runner_label }}"]
    timeout-minutes: 30
    # Run the build + test inside AMD's ROCm image so we don't have to install
    # ROCm on the host. The `-complete` tag carries rocm-dev + rocm-libs, which
    # is hipcc and hipFFT for the build; MIGraphX is not in either metapackage
    # and gets added by the deps step below.
    #
    # The 24.04 base is what makes the ORT pin below reachable: the wheel
    # requires Python 3.11+, and the 22.04 image ships 3.10, which caps pip at
    # ORT 1.24.2. It also matches the runner host's Ubuntu.
    container:
      image: rocm/dev-ubuntu-24.04:7.2.3-complete
      options: >-
        --device=/dev/kfd
        --device=/dev/dri
        --group-add video
        --security-opt seccomp=unconfined
        --ipc=host
    steps:
      - uses: actions/checkout@v7

      - name: System info
        run: |
          uname -a
          ls /dev/kfd /dev/dri 2>/dev/null
          rocminfo 2>/dev/null | head -40 || echo "rocminfo not available in container"
          /opt/rocm/bin/migraphx-driver --version 2>/dev/null || true

      # No apt `meson`: the packaged Meson in the ROCm image's Ubuntu base is
      # below the project's floor. Meson comes from pip in a venv instead, as
      # it does in build.yml, and so does the ORT wheel below — everything
      # Python lands in the same venv.
      - name: System deps (image has rocm; add migraphx + chromadec build deps)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          # migraphx comes from the ROCm apt repo the image already registers.
          # The ORT MIGraphX EP dlopens libmigraphx at session creation, so
          # without it the EP attach fails and we'd silently validate the CPU
          # path instead. Its heavy dependencies are already in rocm-libs.
          apt-get install -y --no-install-recommends -qq \
            migraphx \
            ninja-build pkg-config cmake git file curl \
            libsqlite3-dev libfftw3-dev \
            build-essential python3-pip python3-venv

      - name: Python venv (meson)
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install meson

      - name: Install AMD ORT-MIGraphX wheel
        run: |
          # onnxruntime-migraphx, not onnxruntime-rocm: AMD publishes both and
          # they carry different execution providers. The rocm one has no
          # MIGraphX EP, and it trails several releases behind besides.
          #
          # Straight from PyPI at the version every other platform in this
          # project pins, so there is one ORT version everywhere and no second
          # package index. The MIGraphX EP's ROCm coupling is just
          # libmigraphx_c.so.3 + libamdhip64.so.7, which ROCm 7.2.3 satisfies.
          #
          # Into the venv, like every other Python dependency. On the image's
          # own interpreter this needed --break-system-packages, and it mutated
          # a root-owned site-packages to boot.
          . .venv/bin/activate
          pip install onnxruntime-migraphx==1.27.1
          python3 -c "import onnxruntime; print(onnxruntime.__version__); print(onnxruntime.get_available_providers())"

      # The wheel is the only C/C++-usable MIGraphX ORT that AMD publishes in
      # any form (the ROCm apt repo and rocm/onnxruntime images carry no
      # headers either), and it ships bare: capi/ holds the runtime objects,
      # with no headers and no lib/ for the linker. Compose a conventional
      # install root from Microsoft's release of the same version (headers)
      # and the wheel (every .so). Under /opt because meson rejects an
      # onnxruntime_root inside the source tree.
      - name: Compose a linkable ORT root (MS headers + wheel libraries)
        run: |
          . .venv/bin/activate
          WHEEL_CAPI=$(python -c "import onnxruntime, os; print(os.path.join(os.path.dirname(onnxruntime.__file__), 'capi'))")
          ORT_VER=$(python -c "import onnxruntime; print(onnxruntime.__version__)")
          curl -sSL -o /tmp/ort-headers.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VER}/onnxruntime-linux-x64-${ORT_VER}.tgz"
          tar -xzf /tmp/ort-headers.tgz -C /tmp
          ORT_ROOT=/opt/ort-migraphx
          mkdir -p "$ORT_ROOT/lib"
          cp -r "/tmp/onnxruntime-linux-x64-${ORT_VER}/include" "$ORT_ROOT/include"
          cp "$WHEEL_CAPI"/libonnxruntime*.so* "$ORT_ROOT/lib/"
          # Both symlinks are load-bearing: .so is how the linker finds the
          # library, .so.1 is the DT_NEEDED name every test executable
          # resolves at run time. The wheel ships neither, and with only the
          # first, linking fails with an undefined OrtGetApiBase@VERS_<ver>.
          ln -sf "libonnxruntime.so.${ORT_VER}" "$ORT_ROOT/lib/libonnxruntime.so"
          ln -sf "libonnxruntime.so.${ORT_VER}" "$ORT_ROOT/lib/libonnxruntime.so.1"
          echo "ORT_ROOT=$ORT_ROOT" >> $GITHUB_ENV
          ls -l "$ORT_ROOT/lib"

      # The MIGraphX provider links libmigraphx_c, which the migraphx package
      # installs under /opt/rocm/lib — a directory the image leaves off the
      # loader's search path entirely (ldconfig knows nothing about it). An
      # unresolved dependency here is invisible at run time: ORT lists the
      # provider as available because that list is compiled in, the attach
      # throws, and the chain falls through to CPU with the suite still green.
      - name: Verify the MIGraphX provider's dependencies resolve
        env:
          LD_LIBRARY_PATH: ${{ env.ORT_ROOT }}/lib:/opt/rocm/lib
        run: |
          so="$ORT_ROOT/lib/libonnxruntime_providers_migraphx.so"
          test -e "$so" || { echo "no MIGraphX provider at $so" >&2; exit 1; }
          missing=$(ldd "$so" | awk '/not found/ {print $1}')
          if [ -n "$missing" ]; then
            echo "MIGraphX provider cannot load; the EP would fall back to CPU:" >&2
            echo "$missing" >&2
            exit 1
          fi
          echo "every MIGraphX provider dependency resolves"

      - name: Configure (with_rocm=enabled)
        run: |
          . .venv/bin/activate
          meson setup build \
            -Donnxruntime_root="$ORT_ROOT" \
            -Dwith_rocm=enabled

      - name: Build
        run: |
          . .venv/bin/activate
          meson compile -C build

      - name: Set up encode-orc (drives integration fixtures)
        uses: ./.github/actions/setup-encode-orc

      # libmigraphx_c sits in /opt/rocm/lib, which the image leaves off the
      # loader path; without it next to ORT_ROOT/lib the MIGraphX EP cannot
      # attach. The expected-backend value turns a silent CPU fallback into a
      # test failure (16 is CHD_NN_ORT_MIGRAPHX in include/chromadec/nn.h);
      # the ldd guard above cannot catch a provider that loads fine on a box
      # whose GPU is absent or driverless.
      - name: Test (HIP / MIGraphX pipeline)
        env:
          LD_LIBRARY_PATH: ${{ env.ORT_ROOT }}/lib:/opt/rocm/lib
          CHD_TEST_EXPECT_NN_BACKEND: "16"
        run: |
          . .venv/bin/activate
          meson test -C build --print-errorlogs

  cleanup:
    needs: [launch-spot, amd-test]
    if: always() && vars.AWS_GPU_RUNNER_ROLE_ARN != ''
    # Separate environment, deliberately free of protection rules: this job
    # terminates the instance and must never wait on an approval. It exists
    # only to give cleanup an OIDC subject the role trusts.
    environment: gpu-ci-cleanup
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_GPU_RUNNER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terminate spot instance (belt and suspenders)
        if: needs.launch-spot.outputs.instance_id != ''
        run: |
          aws ec2 terminate-instances \
            --instance-ids "${{ needs.launch-spot.outputs.instance_id }}" \
            || echo "Instance already terminated"