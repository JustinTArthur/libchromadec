name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  # meson.build and nix/libchromadec.nix read VERSION.txt directly; the Cargo
  # manifests cannot, so they are gated here instead.
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/check-version.sh

  # encode-orc is built once, here, and every OS below decodes the TBCs this
  # job produces rather than building its own copy of the encoder. The fixtures
  # are a few MB of raw samples that say nothing about the machine that made
  # them, so one producer is enough, and it means the platforms are all
  # decoding byte-identical input instead of whatever their own encode-orc
  # build happened to emit.
  fixtures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up encode-orc
        uses: ./.github/actions/setup-encode-orc

      - name: Synthesize the NTSC + PAL fixtures
        run: ./scripts/make-fixtures.sh "${GITHUB_WORKSPACE}/fixtures"

      - uses: actions/upload-artifact@v4
        with:
          name: tbc-fixtures
          path: fixtures
          if-no-files-found: error
          # Raw 16-bit samples compress well, but re-zipping them per job is
          # not worth the CPU on either end.
          compression-level: 1
          retention-days: 1

  linux:
    name: linux-${{ matrix.arch }}
    needs: fixtures
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            ort_arch: x64
          - arch: arm64
            runner: ubuntu-24.04-arm
            ort_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config libsqlite3-dev libfftw3-dev

      - name: Python venv
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install meson

      - name: Download ONNX Runtime (Microsoft release, Linux ${{ matrix.arch }} CPU)
        run: |
          ORT_VER=1.27.1
          curl -L -o ort.tgz "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VER}/onnxruntime-linux-${{ matrix.ort_arch }}-${ORT_VER}.tgz"
          mkdir -p ${HOME}/ort
          tar -xzf ort.tgz -C ${HOME}/ort --strip-components=1
          echo "ORT_ROOT=${HOME}/ort" >> $GITHUB_ENV

      - name: Configure
        run: |
          . .venv/bin/activate
          meson setup build -Dwith_examples=true -Donnxruntime_root="${ORT_ROOT}"

      - name: Build
        run: |
          . .venv/bin/activate
          meson compile -C build

      - name: Fetch the prebuilt TBC fixtures
        uses: actions/download-artifact@v4
        with:
          name: tbc-fixtures
          path: fixtures

      - name: Test
        env:
          LD_LIBRARY_PATH: ${{ env.ORT_ROOT }}/lib
          CHD_ENCODE_ORC_FIXTURE_DIR: ${{ github.workspace }}/fixtures
        run: |
          . .venv/bin/activate
          meson test -C build --print-errorlogs

      - name: Verify exported chd_* symbols
        run: |
          # Lib name is libchromadec.so.0.x.y; resolve the actual file.
          LIB=$(ls build/src/libchromadec.so.0.* 2>/dev/null | head -1)
          test -n "$LIB" || (echo "no built shared lib found" >&2; exit 1)
          echo "Inspecting $LIB"
          nm -D --defined-only "$LIB" | awk '$2 == "T" && $3 ~ /^chd_/ { print $3 }' > /tmp/exports.txt
          wc -l /tmp/exports.txt
          test "$(wc -l < /tmp/exports.txt)" -ge 40
          # No non-chd_ globals should leak.
          nm -D --defined-only "$LIB" | awk '$2 == "T" && $3 !~ /^chd_/ { print $3 }' > /tmp/leaks.txt
          if [ -s /tmp/leaks.txt ]; then
            echo "Non-chd_ symbols leaked:"; cat /tmp/leaks.txt; exit 1
          fi

      - name: Install (DESTDIR sandbox)
        run: |
          . .venv/bin/activate
          DESTDIR=/tmp/inst meson install -C build --quiet
          find /tmp/inst -type f | head -30

      - name: CMake consumer smoke test (find_package + pkg-config)
        env:
          LD_LIBRARY_PATH: ${{ env.ORT_ROOT }}/lib
        run: |
          . .venv/bin/activate
          # Install to a real prefix (not a DESTDIR sandbox): the generated
          # chromadec.pc / chromadecConfig.cmake bake in the configured prefix,
          # so a relocatable consumer test needs the prefix to be the real one.
          meson configure build -Dprefix=/tmp/inst-cmake
          meson install -C build --quiet
          cfg=$(find /tmp/inst-cmake -name chromadecConfig.cmake | head -1)
          pc=$(find /tmp/inst-cmake -name chromadec.pc | head -1)
          lib=$(find /tmp/inst-cmake -name 'libchromadec.so.0.*' | head -1)
          test -n "$cfg" || { echo "chromadecConfig.cmake not installed" >&2; exit 1; }
          test -n "$pc"  || { echo "chromadec.pc not installed" >&2; exit 1; }
          # The CMake config has no exported targets file; it falls back to
          # pkg-config, so PKG_CONFIG_PATH must point at the installed .pc.
          export PKG_CONFIG_PATH="$(dirname "$pc")"
          export LD_LIBRARY_PATH="$(dirname "$lib"):${LD_LIBRARY_PATH}"
          cmake -S tests/cmake-consumer -B /tmp/cc-build -Dchromadec_DIR="$(dirname "$cfg")"
          cmake --build /tmp/cc-build
          /tmp/cc-build/consumer

  # x86_64 only — one sanitizer run is enough to gate the suite.
  linux-asan-ubsan:
    needs: fixtures
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config libsqlite3-dev libfftw3-dev

      - name: Python venv
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install meson

      - name: Download ONNX Runtime (Microsoft release, Linux x64 CPU)
        run: |
          ORT_VER=1.27.1
          curl -L -o ort.tgz "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VER}/onnxruntime-linux-x64-${ORT_VER}.tgz"
          mkdir -p ${HOME}/ort
          tar -xzf ort.tgz -C ${HOME}/ort --strip-components=1
          echo "ORT_ROOT=${HOME}/ort" >> $GITHUB_ENV

      - name: Configure (ASan + UBSan)
        run: |
          . .venv/bin/activate
          meson setup build \
            -Donnxruntime_root="${ORT_ROOT}" \
            -Db_sanitize=address,undefined \
            -Db_lundef=false

      - name: Build
        run: |
          . .venv/bin/activate
          meson compile -C build

      - name: Fetch the prebuilt TBC fixtures
        uses: actions/download-artifact@v4
        with:
          name: tbc-fixtures
          path: fixtures

      - name: Test
        env:
          LD_LIBRARY_PATH: ${{ env.ORT_ROOT }}/lib
          CHD_ENCODE_ORC_FIXTURE_DIR: ${{ github.workspace }}/fixtures
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          ASAN_OPTIONS: detect_leaks=0
        run: |
          . .venv/bin/activate
          meson test -C build --print-errorlogs

  # TSan is its own job because address+thread can't be combined in one
  # binary. x86_64 only (the suite is identical to the ASan run; we just
  # want to catch races in the chd_decode_frames_async path).
  linux-tsan:
    needs: fixtures
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config libsqlite3-dev libfftw3-dev

      - name: Python venv
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install meson

      - name: Download ONNX Runtime (Microsoft release, Linux x64 CPU)
        run: |
          ORT_VER=1.27.1
          curl -L -o ort.tgz "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VER}/onnxruntime-linux-x64-${ORT_VER}.tgz"
          mkdir -p ${HOME}/ort
          tar -xzf ort.tgz -C ${HOME}/ort --strip-components=1
          echo "ORT_ROOT=${HOME}/ort" >> $GITHUB_ENV

      - name: Configure (TSan)
        run: |
          . .venv/bin/activate
          meson setup build \
            -Donnxruntime_root="${ORT_ROOT}" \
            -Db_sanitize=thread \
            -Db_lundef=false

      - name: Build
        run: |
          . .venv/bin/activate
          meson compile -C build

      - name: Fetch the prebuilt TBC fixtures
        uses: actions/download-artifact@v4
        with:
          name: tbc-fixtures
          path: fixtures

      - name: Test
        env:
          LD_LIBRARY_PATH: ${{ env.ORT_ROOT }}/lib
          CHD_ENCODE_ORC_FIXTURE_DIR: ${{ github.workspace }}/fixtures
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: |
          . .venv/bin/activate
          meson test -C build --print-errorlogs

  macos:
    name: macos-${{ matrix.arch }}
    needs: fixtures
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            ort_arch: arm64
            # 1.27.1 is current; macOS arm64 has shipped every release.
            ort_ver: '1.27.1'
          - arch: x86_64
            runner: macos-15-intel
            # Microsoft froze onnxruntime-osx-x86_64 at 1.23.2 (1.24.0+ ships
            # arm64 only), and that frozen build isn't reliably discoverable on
            # the retiring macos-15-intel runner. Intel Macs are EOL, so this job
            # validates the C core + native CoreML backend with the ORT backend
            # off; arm64 covers the full ORT-backed build.
            no_ort: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: System deps
        run: brew install ninja pkg-config sqlite fftw

      - name: Python venv
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install meson

      - name: Download ONNX Runtime (Microsoft release, macOS ${{ matrix.arch }} with CoreML)
        if: ${{ !matrix.no_ort }}
        run: |
          ORT_VER=${{ matrix.ort_ver }}
          curl -L -o ort.tgz "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VER}/onnxruntime-osx-${{ matrix.ort_arch }}-${ORT_VER}.tgz"
          mkdir -p ${HOME}/ort
          tar -xzf ort.tgz -C ${HOME}/ort --strip-components=1
          echo "ORT_ROOT=${HOME}/ort" >> $GITHUB_ENV

      - name: Configure
        run: |
          . .venv/bin/activate
          if [ "${{ matrix.no_ort }}" = "true" ]; then
            meson setup build -Dwith_onnxruntime=false
          else
            meson setup build -Donnxruntime_root="${ORT_ROOT}"
          fi

      - name: Build
        run: |
          . .venv/bin/activate
          meson compile -C build

      - name: Fetch the prebuilt TBC fixtures
        uses: actions/download-artifact@v4
        with:
          name: tbc-fixtures
          path: fixtures

      - name: Test
        env:
          DYLD_LIBRARY_PATH: ${{ env.ORT_ROOT }}/lib
          CHD_ENCODE_ORC_FIXTURE_DIR: ${{ github.workspace }}/fixtures
        run: |
          . .venv/bin/activate
          meson test -C build --print-errorlogs

      - name: Verify exported chd_* symbols
        run: |
          # Dylib name is libchromadec.0.x.y.dylib; resolve the actual file.
          LIB=$(ls build/src/libchromadec.0.*.dylib 2>/dev/null | head -1)
          test -n "$LIB" && test -f "$LIB" || (echo "no built dylib under build/src" >&2; exit 1)
          nm -g "$LIB" | awk '$2 == "T" && $3 ~ /^_chd_/ { print substr($3,2) }' > /tmp/exports.txt
          wc -l /tmp/exports.txt
          test "$(wc -l < /tmp/exports.txt)" -ge 40
          # No non-chd_ globals should be exported.
          nm -g "$LIB" | awk '$2 == "T" && $3 !~ /^_chd_/ { print $3 }' > /tmp/leaks.txt
          if [ -s /tmp/leaks.txt ]; then
            echo "Non-chd_ symbols leaked:"; cat /tmp/leaks.txt; exit 1
          fi

  # Windows MSVC. Skeleton — expected to need first-run iteration once
  # the repo lands on GitHub (vcpkg/meson/pkg-config/MSVC environment
  # interactions can't be fully validated locally on macOS/Linux).
  #
  # Every leg runs natively, so each one tests what it builds. Cross-compiling
  # arm64 from an x64 runner would need a meson cross file and would leave the
  # arm64 suite unrun, which is the part most likely to break.
  windows:
    name: windows-${{ matrix.label }}
    needs: fixtures
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            label: x64
            runner: windows-2025
            triplet: x64-windows
            ort_arch: x64
            ort_source: release
          - arch: arm64
            label: arm64
            runner: windows-11-arm
            triplet: arm64-windows
            # Microsoft ships no -gpu- variant for Windows arm64; the plain
            # archive is the only one published for this arch.
            ort_arch: arm64
            ort_source: release
          # DirectML is the one Windows execution provider with no hardware
          # requirement a CI runner can't meet in software, so this is the one
          # worth a dedicated leg to prove attaches for real. attachDirectML
          # registers through the generic AppendExecutionProvider("DML", ...)
          # entry point (see provider_select.cpp), so it compiles into every
          # Windows build regardless of which ONNX Runtime package supplied
          # the headers; what only this leg's package supplies is a
          # DirectML.dll actually sitting next to onnxruntime.dll for the
          # delay-load to resolve. This leg builds against that package and
          # asserts the provider is really there. It does not pin the
          # provider for the suite: a GitHub runner has no D3D12 adapter
          # DirectML accepts (a pinned attach fails with C0262002, invalid
          # display adapter handle), so a real attach is proven on hardware,
          # not here.
          - arch: x64
            label: x64-directml
            runner: windows-2025
            triplet: x64-windows
            ort_arch: x64
            ort_source: nuget-windowsml
    runs-on: ${{ matrix.runner }}
    env:
      # Pinned rather than taken from the image: the x64 runner ships a vcpkg
      # that moves whenever GitHub rebuilds the image, and a --depth 1 clone of
      # master moves daily. Either way the two legs could resolve different
      # port versions, and no binary cache key would stay valid.
      VCPKG_REF: '2026.06.24'
    steps:
      - uses: actions/checkout@v7

      - name: Set up MSVC environment (${{ matrix.arch }})
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ matrix.arch }}

      # fftw3 is the only port left here. SQLite comes from the bundled
      # amalgamation through subprojects/sqlite3.wrap, which is the same source
      # the macOS release package already links, so vcpkg no longer builds a
      # copy this build does not use. fftw3 itself costs ~2.5 min a leg because
      # vcpkg builds it debug and release across three precisions, so its
      # binary packages are cached rather than rebuilt every run.
      - name: Cache vcpkg binary packages
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/vcpkg-bincache
          # The port list is spelled into the key on purpose: change the
          # install line below and this has to change with it.
          key: vcpkg-${{ matrix.triplet }}-${{ env.VCPKG_REF }}-fftw3
          # A stale cache still helps — vcpkg rebuilds only what its ABI hashes
          # say is missing.
          restore-keys: vcpkg-${{ matrix.triplet }}-

      - name: vcpkg deps (fftw3)
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}\vcpkg-bincache,readwrite'
        run: |
          $vcpkgRoot = "$env:GITHUB_WORKSPACE\vcpkg"
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\vcpkg-bincache" | Out-Null
          # Fetch just the pinned commit rather than cloning the full history.
          git init -q $vcpkgRoot
          git -C $vcpkgRoot remote add origin https://github.com/microsoft/vcpkg.git
          git -C $vcpkgRoot fetch -q --depth 1 origin $env:VCPKG_REF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $vcpkgRoot checkout -q FETCH_HEAD
          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$vcpkgRoot\vcpkg.exe" install "fftw3:${{ matrix.triplet }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $vcpkgInstalled = "$vcpkgRoot\installed\${{ matrix.triplet }}"
          "PKG_CONFIG_PATH=$vcpkgInstalled\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CMAKE_PREFIX_PATH=$vcpkgInstalled" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$vcpkgInstalled\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      # Prepending the venv's Scripts to PATH puts meson, ninja and python
      # there for every later step, so the pwsh steps below need no explicit
      # activation. It also means the interpreter Meson picks up for the
      # .def-generating custom target is the venv one.
      - name: Python venv (meson + ninja)
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\pip.exe install meson ninja
          "$env:GITHUB_WORKSPACE\.venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Download ONNX Runtime (Microsoft release, Windows ${{ matrix.arch }} CPU)
        if: matrix.ort_source == 'release'
        shell: pwsh
        run: |
          $ORT_VER = "1.27.1"
          Invoke-WebRequest "https://github.com/microsoft/onnxruntime/releases/download/v$ORT_VER/onnxruntime-win-${{ matrix.ort_arch }}-$ORT_VER.zip" -OutFile ort.zip
          Expand-Archive -Path ort.zip -DestinationPath "$env:USERPROFILE\ort_extract"
          $ortDir = (Get-ChildItem "$env:USERPROFILE\ort_extract" | Where-Object PSIsContainer | Select-Object -First 1).FullName
          "ORT_ROOT=$ortDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$ortDir\lib" | Out-File -FilePath $env:GITHUB_PATH -Append

      # Microsoft.Windows.AI.MachineLearning (Windows ML) rather than the
      # DirectML-flavoured Microsoft.ML.OnnxRuntime.DirectML package: the
      # latter's ONNX Runtime version is permanently frozen at 1.24.4 on
      # every channel Microsoft ships it through, NuGet and the PyPI wheel
      # alike, because newer Windows work went into Windows ML instead. This
      # package keeps shipping new ORT versions, so pin it like any other
      # dependency and bump it over time instead of being stuck.
      #
      # DirectML.dll ships in the same runtimes/<rid>/native directory as
      # onnxruntime.dll in this package, so unlike the old DirectML leg there
      # is no second package to restore and no DLL to copy across.
      #
      # -Donnxruntime_root understands this package's layout directly (see
      # the three-way ORT discovery in meson.build): the import library lives
      # under lib/native/<arch> rather than beside the DLL, which is a
      # different on-disk shape from the classic NuGet layout, not a drop-in
      # substitute for it — pointing at the package unmodified is deliberate,
      # the same as the old leg.
      - name: Install ONNX Runtime (NuGet Windows ML, Windows ${{ matrix.arch }})
        if: matrix.ort_source == 'nuget-windowsml'
        shell: pwsh
        run: |
          $ORT_VER = "2.2.12"
          if (-not (Get-Command nuget -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest "https://dist.nuget.org/win-x86-commandline/latest/nuget.exe" -OutFile "$env:GITHUB_WORKSPACE\nuget.exe"
            $env:PATH = "$env:GITHUB_WORKSPACE;$env:PATH"
          }
          # Outside the workspace: Meson rejects include paths that resolve
          # inside the source tree.
          $nugetDir = "$env:USERPROFILE\nuget"
          nuget install Microsoft.Windows.AI.MachineLearning -Version $ORT_VER -OutputDirectory $nugetDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pkg = Get-ChildItem $nugetDir -Directory -Filter "Microsoft.Windows.AI.MachineLearning*" | Select-Object -First 1
          if (-not $pkg) { Write-Error "Microsoft.Windows.AI.MachineLearning was not restored"; exit 1 }
          $native = "$($pkg.FullName)\runtimes\win-${{ matrix.ort_arch }}\native"
          "ORT_ROOT=$($pkg.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$native" | Out-File -FilePath $env:GITHUB_PATH -Append

      # force-fallback-for=sqlite3 states outright what dropping the vcpkg port
      # would otherwise leave to chance: take the bundled amalgamation, whatever
      # SQLite the runner image happens to expose. Mirrors the macOS release job.
      - name: Configure
        shell: pwsh
        run: |
          meson setup build `
            --force-fallback-for=sqlite3 `
            "-Donnxruntime_root=$env:ORT_ROOT"

      - name: Build
        shell: pwsh
        run: meson compile -C build

      - name: Fetch the prebuilt TBC fixtures
        uses: actions/download-artifact@v4
        with:
          name: tbc-fixtures
          path: fixtures

      - name: Test
        shell: pwsh
        env:
          CHD_ENCODE_ORC_FIXTURE_DIR: ${{ github.workspace }}/fixtures
          # 15 = CHD_NN_ORT_DIRECTML. Empty on the CPU legs, which the NN suite
          # reads as "no provider to require". This asserts the linked package
          # really carries the provider this leg was built for, so picking up a
          # CPU-only ONNX Runtime by accident fails instead of passing quietly.
          CHD_TEST_REQUIRE_ORT_PROVIDER: ${{ matrix.ort_source == 'nuget-windowsml' && '15' || '' }}
        run: meson test -C build --print-errorlogs

      - name: Verify exported chd_* symbols
        shell: pwsh
        run: |
          $dll = (Get-ChildItem build\src\chromadec*.dll | Select-Object -First 1).FullName
          if (-not $dll) { Write-Error "no built chromadec DLL found"; exit 1 }
          Write-Host "Inspecting $dll"
          $out = & dumpbin /exports $dll
          # dumpbin export rows look like: "    1    0 00001000 chd_video_open_composite"
          $chd  = ($out | Select-String '\bchd_\w+').Count
          $leak = ($out | Select-String '^\s+\d+\s+\d+\s+[0-9A-Fa-f]+\s+(?!chd_)[A-Za-z_]\w*$').Count
          Write-Host "chd_ exports: $chd  (non-chd globals: $leak)"
          if ($chd -lt 40) { Write-Error "expected >=40 chd_ exports"; exit 1 }
          if ($leak -gt 0) { Write-Error "non-chd symbols leaked"; exit 1 }