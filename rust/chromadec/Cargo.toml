[package]
name = "chromadec"
description = "Safe Rust bindings for libchromadec, the composite video chroma decoding library"
version.workspace = true
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Async `Stream` adapter for the batch decoder, driven by a Tokio runtime.
tokio = ["dep:tokio", "dep:futures-core"]
# Bridge the library's diagnostic sink into the `log` crate facade.
log = ["dep:log"]

[dependencies]
chromadec-sys = { path = "../chromadec-sys", version = "0.2.0" }
tokio = { version = "1", optional = true, default-features = false, features = ["rt", "sync"] }
futures-core = { version = "0.3", optional = true, default-features = false }
log = { version = "0.4", optional = true, default-features = false }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "sync"] }
futures-util = { version = "0.3", default-features = false }
futures-core = { version = "0.3", default-features = false }

[package.metadata.docs.rs]
all-features = true